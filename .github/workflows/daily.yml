name: Daily pipeline

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the day's data commit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # A run where every company returns zero rows exits 1 and stops the job here.
      - name: Collect today's postings
        run: python -m pipeline.run

      - name: Commit the raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir . --target duckdb

      - name: Build the models (seeds, models, tests)
        working-directory: dbt
        run: dbt build --profiles-dir . --target duckdb

      - name: Build the dashboard
        run: python -m dashboard.build --db dbt/warehouse.duckdb --raw data/raw --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
