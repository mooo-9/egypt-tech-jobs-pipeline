version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: postings
        config:
          loaded_at_field: cast(collected_at as timestamp)
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        description: "One row per posting per day it was seen. DuckDB: a view over the raw Parquet files (see the create_raw_postings macro). Postgres: the table the Airflow load task fills."
