version: 2

seeds:
  - name: skills
    description: "Skill dictionary. pattern is a case-insensitive regex matched against title + description."
    columns:
      - name: skill
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]
      - name: pattern
        data_tests: [not_null]
  - name: title_rules
    description: "Priority-ordered title regexes; per field the lowest-priority-number match wins."
    columns:
      - name: field
        data_tests:
          - accepted_values:
              arguments:
                values: [role_family, seniority]
